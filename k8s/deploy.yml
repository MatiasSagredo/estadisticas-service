apiVersion: apps/v1
kind: Deployment
metadata:
  name: estadisticas-service
  namespace: vidalcasino
  labels:
    app: estadisticas-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: estadisticas-service
  template:
    metadata:
      labels:
        app: estadisticas-service
    spec:
      containers:
        - name: estadisticas
          image: 088950558880.dkr.ecr.us-east-1.amazonaws.com/casino/estadisticas:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
          envFrom:
            - secretRef:
                name: casino-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/estadisticas/readyz
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/estadisticas/livez
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 10
